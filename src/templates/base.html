<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Campus Event Manager{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<header>
    <div class="container">

        <h1>Campus Event Manager</h1>

        <nav>
            <a href="/">Dashboard</a>
            <a href="/events">Events</a>
            <a href="/users">Users</a>
            <a href="/analytics">Analytics</a>
        </nav>

    </div>
</header>


<main>
    <div class="container">

        {% block content %}
        {% endblock %}

    </div>
</main>


<footer>
    Campus Event Manager — MongoDB & Flask Project
</footer>

</body>
</html>
